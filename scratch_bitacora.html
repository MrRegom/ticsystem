<!-- Modal Bitácora -->
<div class="modal fade" id="modalBitacora" tabindex="-1" role="dialog" aria-hidden="true" data-backdrop="static">
  <div class="modal-dialog modal-xl modal-dialog-centered" role="document">
    <div class="modal-content">
        <div class="modal-header-clean">
          <h5 id="modalBitacoraLabel"><i class="fas fa-history"></i> Bitácora del Equipo: <span id="b-equipo-sn"></span></h5>
          <button type="button" class="close" data-dismiss="modal" style="opacity: 0.5; outline:none;">&times;</button>
        </div>
        
        <div class="modal-body-clean">
          <div class="row">
            <!-- Formulario de Nuevo Registro -->
            <div class="col-md-4 border-right pr-4">
              <h6 class="font-weight-bold mb-3 text-primary">Registrar Mantenimiento</h6>
              <form id="form-bitacora">
                <input type="hidden" id="b-equipo-id" value="">
                
                <div class="form-group mb-3">
                  <label class="form-label-clean">Tipo de Registro <span class="text-danger">*</span></label>
                  <select class="form-control-clean select2" id="b-tipo" required>
                    <option value="">-- Seleccionar --</option>
                    {% for tr in tipos_registro_bitacora %}<option value="{{ tr.id }}">{{ tr.nombre }}</option>{% endfor %}
                  </select>
                </div>
                
                <div class="form-group mb-3">
                  <label class="form-label-clean">Fecha de Mantención <span class="text-danger">*</span></label>
                  <input type="date" class="form-control-clean" id="b-fecha-mtto" required>
                </div>
                
                <div class="form-group mb-3">
                  <label class="form-label-clean">Falla Reportada / Motivo</label>
                  <textarea class="form-control-clean" id="b-falla" rows="2"></textarea>
                </div>
                
                <div class="form-group mb-3">
                  <label class="form-label-clean">Actividades Realizadas</label>
                  <textarea class="form-control-clean" id="b-actividades" rows="3"></textarea>
                </div>

                <div class="form-group mb-3">
                  <label class="form-label-clean">Solicitante (Opcional)</label>
                  <input type="text" class="form-control-clean" id="b-solicitante" placeholder="Nombre de quien reporta">
                </div>
                
                <button type="submit" class="btn btn-primary w-100" id="btn-guardar-bitacora" style="border-radius: 8px; font-weight: 600;">
                  <i class="fas fa-save mr-1"></i> Guardar Registro
                </button>
              </form>
            </div>
            
            <!-- Línea de Tiempo (Historial) -->
            <div class="col-md-8 pl-4">
              <h6 class="font-weight-bold mb-3 text-secondary">Historial de Intervenciones</h6>
              <div id="bitacora-timeline" style="max-height: 500px; overflow-y: auto; padding-right: 10px;">
                <!-- Cargado via AJAX -->
                <div class="text-center py-5 text-muted">
                    <div class="spinner-border text-primary mb-2" role="status"></div>
                    <p>Cargando bitácora...</p>
                </div>
              </div>
            </div>
          </div>
        </div>
        
        <div class="modal-footer-clean">
          <button type="button" class="btn" data-dismiss="modal" style="font-weight:600; color:#64748b; background:transparent;">Cerrar</button>
        </div>
    </div>
  </div>
</div>
