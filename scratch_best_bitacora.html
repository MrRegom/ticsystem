<!-- Modal Bitácora -->
<div class="modal fade" id="modalBitacora" tabindex="-1" role="dialog" aria-hidden="true" data-backdrop="static">
  <div class="modal-dialog modal-xl modal-dialog-centered" role="document" style="max-width: 1400px; width: 95%;">
    <div class="modal-content" style="background-color: #f1f5f9;">
        <!-- Ficha superior -->
        <div class="modal-header" style="background: #0056b3; color: white; border-bottom: none; border-radius: 8px 8px 0 0; padding: 15px 20px;">
          <h5 style="margin: 0; font-size: 1.1rem;"><i class="fas fa-history mr-2"></i> Bitácora de Movimientos y Mantenciones</h5>
          <p style="margin: 0; font-size: 0.8rem; opacity: 0.8;">Historial técnico del equipo con trazabilidad de acciones</p>
          <button type="button" class="close text-white" data-dismiss="modal" style="position: absolute; right: 20px; top: 15px; opacity: 0.8;">&times;</button>
        </div>
        
        <div class="modal-body p-4">
          <!-- Tarjeta del Equipo -->
          <div class="card shadow-sm mb-4" style="border-radius: 12px; border: none;">
            <div class="card-body p-4">
              <div class="row align-items-center">
                <div class="col-md-1 text-center">
                  <img id="b-imagen" src="/static/img/placeholder_equipo.png" style="max-height: 60px; object-fit: contain;">
                </div>
                <div class="col-md-4 border-right">
                  <div style="font-size: 0.7rem; color: #64748b; font-weight: 700; text-transform: uppercase;">EQUIPO SELECCIONADO</div>
                  <h3 id="b-equipo-sn" style="font-weight: 800; color: #0f172a; margin: 0; font-size: 1.5rem;">Cargando...</h3>
                </div>
                <div class="col-md-7 text-right">
                   <!-- KPI mini -->
                   <div class="d-inline-block text-left mr-3 p-2" style="border: 1px solid #e2e8f0; border-radius: 8px;">
                      <div style="font-size: 0.65rem; color: #64748b; font-weight: 700; text-transform: uppercase;">ESTADO</div>
                      <div id="b-equipo-estado" style="font-size: 0.9rem; font-weight: 600; color: #166534;">-</div>
                   </div>
                   <div class="d-inline-block text-left mr-3 p-2" style="border: 1px solid #e2e8f0; border-radius: 8px;">
                      <div style="font-size: 0.65rem; color: #64748b; font-weight: 700; text-transform: uppercase;">UBICACIÓN</div>
                      <div id="b-equipo-ubicacion" style="font-size: 0.9rem; font-weight: 600; color: #334155;">-</div>
                   </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Formulario Ancho -->
          <div class="card shadow-sm mb-4" style="border-radius: 12px; border: none; border-top: 4px solid #3b82f6;">
            <div class="card-header bg-white" style="border-bottom: 1px solid #e2e8f0; padding: 12px 20px;">
              <h6 class="m-0" style="color: #2563eb; font-weight: 700; font-size: 0.85rem;"><i class="fas fa-edit mr-1"></i> REGISTRAR NUEVA ACTIVIDAD</h6>
            </div>
            <div class="card-body p-4">
              <form id="form-bitacora">
                <input type="hidden" id="b-equipo-id" value="">
                
                <div class="row">
                  <div class="col-md-3 mb-3">
                    <label class="form-label-clean" style="font-size: 0.75rem; text-transform: uppercase;">Tipo de Registro <span class="text-danger">*</span></label>
                    <select class="form-control-clean select2 w-100" id="b-tipo" required>
                      <option value="">-- Seleccionar --</option>
                      {% for tr in tipos_registro_bitacora %}<option value="{{ tr.id }}">{{ tr.nombre }}</option>{% endfor %}
                    </select>
                  </div>
                  <div class="col-md-2 mb-3">
                    <label class="form-label-clean" style="font-size: 0.75rem; text-transform: uppercase;">Fecha Ingreso <span class="text-danger">*</span></label>
                    <input type="date" class="form-control-clean w-100" id="b-fecha-mtto" required>
                  </div>
                  <div class="col-md-2 mb-3">
                    <label class="form-label-clean" style="font-size: 0.75rem; text-transform: uppercase; color:#64748b;">Fecha Devolución</label>
                    <input type="date" class="form-control-clean w-100" id="b-fecha-dev">
                  </div>
                  <div class="col-md-5 mb-3">
                    <label class="form-label-clean" style="font-size: 0.75rem; text-transform: uppercase;">Servicio / Unidad</label>
                    <select class="form-control-clean select2 w-100" id="b-unidad">
                      <option value="">-- Seleccionar unidad --</option>
                      {% for u in unidades %}<option value="{{ u.nombre }}">{{ u.nombre }}</option>{% endfor %}
                    </select>
                  </div>
                </div>

                <div class="row">
                  <div class="col-md-6 mb-3">
                    <label class="form-label-clean" style="font-size: 0.75rem; text-transform: uppercase;">Solicitante (Opcional)</label>
                    <input type="text" class="form-control-clean w-100" id="b-solicitante" placeholder="¿Quién reportó/solicitó?">
                  </div>
                  <div class="col-md-6 mb-3">
                    <label class="form-label-clean" style="font-size: 0.75rem; text-transform: uppercase;">Falla Reportada o Motivo</label>
                    <select class="form-control-clean select2 w-100" id="b-falla">
                      <option value="">-- Seleccionar falla/motivo --</option>
                      {% for f in fallas_motivos %}<option value="{{ f.id }}">{{ f.nombre }}</option>{% endfor %}
                    </select>
                  </div>
                </div>

                <div class="row">
                  <div class="col-12 mb-3">
                    <label class="form-label-clean" style="font-size: 0.75rem; text-transform: uppercase;">Actividades Realizadas <span class="text-danger">*</span></label>
                    <textarea class="form-control-clean w-100" id="b-actividades" rows="2" placeholder="Detalle técnico de lo realizado..." required></textarea>
                  </div>
                </div>
                
                <div class="text-right mt-2">
                  <button type="button" class="btn btn-light border mr-2" data-dismiss="modal">Cancelar</button>
                  <button type="submit" class="btn btn-primary" id="btn-guardar-bitacora" style="padding: 8px 20px; font-weight: 600;">
                    <i class="fas fa-save mr-1"></i> Guardar Registro
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Historial de Registros -->
          <div class="card shadow-sm" style="border-radius: 12px; border: none;">
            <div class="card-header bg-white" style="border-bottom: 1px solid #e2e8f0; padding: 12px 20px;">
              <h6 class="m-0" style="color: #64748b; font-weight: 700; font-size: 0.85rem;"><i class="far fa-clock mr-1"></i> Historial de registros <span style="font-weight:400; font-size:0.75rem; margin-left:10px;">Datos ordenados cronológicamente</span></h6>
            </div>
            <div class="card-body p-4" style="background: #f8fafc; max-height: 450px; overflow-y: auto;">
              <div id="bitacora-timeline">
                <div class="text-center py-5 text-muted">
                    <div class="spinner-border text-primary mb-2" role="status"></div>
                    <p>Cargando trazabilidad...</p>
                </div>
              </div>
            </div>
          </div>

        </div>
    </div>
  </div>
</div>
