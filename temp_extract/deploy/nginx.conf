server {
    listen 80;
    server_name plantilla.hospitalfricke.cl;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name plantilla.hospitalfricke.cl;

    ssl_certificate /etc/ssl/certs/hospitalfricke.crt;
    ssl_certificate_key /etc/ssl/private/hospitalfricke.key;

    # Protocolos y Cifrados seguros (OWASP / TLS 1.2 y 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';

    # Seguridad en Cabeceras
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://code.jquery.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://framework.digital.gob.cl; frame-ancestors 'none';" always;

    # Logs de acceso y error independientes
    access_log /var/www/plantilla/logs/nginx_access.log;
    error_log /var/www/plantilla/logs/nginx_error.log;

    # Archivos Estáticos
    location /static/ {
        alias /var/www/plantilla/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Archivos Media (Subidas del Hospital)
    location /media/ {
        alias /var/www/plantilla/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Redirección al Socket Unix de Gunicorn
    location / {
        include proxy_params;
        proxy_pass http://unix:/var/www/plantilla/plantilla.sock;
        proxy_redirect off;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
