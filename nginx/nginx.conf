upstream ticsystem_web {
    server web:8000;
}

server {
    listen 80;

    # Oculta la versión de Nginx por seguridad
    server_tokens off;

    location / {
        proxy_pass http://ticsystem_web;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
        
        # Setea timeout amplio por si hay consultas pesadas
        proxy_connect_timeout       600;
        proxy_send_timeout          600;
        proxy_read_timeout          600;
        send_timeout                600;
    }

    # Ruta para servir archivos estáticos (CSS, JS, imágenes)
    location /static/ {
        alias /app/staticfiles/;
    }

    # Ruta para servir archivos subidos por usuarios (Media)
    location /media/ {
        alias /app/media/;
    }
}
