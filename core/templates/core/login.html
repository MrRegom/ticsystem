{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Acceso - Hospital Provincial Marga Marga</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,800">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f1f5f9; /* Fondo claro */
      overflow: hidden;
    }
    
    /* Background animado sutil */
    .bg-animation {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 15% 50%, rgba(2, 132, 199, 0.05), transparent 25%),
                  radial-gradient(circle at 85% 30%, rgba(14, 165, 233, 0.03), transparent 25%);
      z-index: 0;
    }

    .glass-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Tarjeta Blanca Limpia */
    .glass-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08);
      animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes floatIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-container {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .logo-img {
      max-width: 180px;
      margin-bottom: 16px;
    }

    .login-title {
      color: #0f172a;
      font-weight: 800;
      font-size: 1.5rem;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    
    .login-subtitle {
      color: #64748b;
      font-size: 0.9rem;
    }

    .custom-input {
      background: #f8fafc !important;
      border: 1px solid #e2e8f0 !important;
      color: #1e293b !important;
      border-radius: 12px !important;
      padding: 12px 16px 12px 42px !important;
      height: 48px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
    }
    
    .custom-input:focus {
      background: #ffffff !important;
      border-color: #38bdf8 !important;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15) !important;
    }

    .custom-input::placeholder {
      color: #94a3b8 !important;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      z-index: 10;
      transition: color 0.3s ease;
    }
    
    .form-group:focus-within .input-icon {
      color: #0284c7;
    }

    .form-group {
      position: relative;
      margin-bottom: 20px;
    }

    .login-btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: none;
      color: white;
      border-radius: 12px;
      height: 48px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.3);
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: white;
    }

    .login-btn:active {
      transform: translateY(0);
    }

    #login-error-alert {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
    }
    
    #login-error-alert i {
      margin-right: 10px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="bg-animation"></div>

  <div class="glass-container">
    <div class="glass-card">
      <div class="logo-container">
        <!-- Logo oficial del hospital -->
        <img src="{% static 'img/logoHospital.jpeg' %}" alt="Logo Hospital Provincial Marga Marga" class="logo-img">
        <h1 class="login-title">TicSystem</h1>
        <p class="login-subtitle">Hospital Provincial Marga Marga</p>
      </div>

      <div id="login-error-alert" class="d-none">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="login-error-message">Credenciales incorrectas.</span>
      </div>

      <form id="login-form" novalidate>
        {% csrf_token %}
        
        <div class="form-group">
          <i class="fas fa-user input-icon"></i>
          <input type="text" id="username" class="form-control custom-input" placeholder="RUT o Usuario (Ej: admin)" required autofocus>
        </div>

        <div class="form-group">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="password" class="form-control custom-input" placeholder="Contraseña" required>
        </div>

        <button type="submit" id="btn-login-submit" class="btn btn-block login-btn mt-4">
          <span id="btn-text">Ingresar al Portal</span>
          <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </form>
      
      <div class="text-center mt-4">
        <p style="color: #64748b; font-size: 0.75rem; margin:0;">Uso exclusivo para funcionarios autorizados.</p>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
