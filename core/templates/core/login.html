{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Acceso - Hospital Marga Marga</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,800">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  
  <style>
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      overflow: hidden;
    }
    
    /* Background animado */
    .bg-animation {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 15% 50%, rgba(2, 132, 199, 0.15), transparent 25%),
                  radial-gradient(circle at 85% 30%, rgba(14, 165, 233, 0.1), transparent 25%);
      z-index: 0;
    }

    .glass-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: floatIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes floatIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .logo-container {
      text-align: center;
      margin-bottom: 32px;
    }
    
    .logo-container i {
      font-size: 3rem;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .login-title {
      color: #f8fafc;
      font-weight: 700;
      font-size: 1.5rem;
      margin-bottom: 4px;
    }
    
    .login-subtitle {
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .custom-input {
      background: rgba(15, 23, 42, 0.6) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #f8fafc !important;
      border-radius: 12px !important;
      padding: 12px 16px 12px 42px !important;
      height: 48px;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }
    
    .custom-input:focus {
      background: rgba(15, 23, 42, 0.8) !important;
      border-color: #38bdf8 !important;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1) !important;
    }

    .custom-input::placeholder {
      color: #64748b !important;
    }

    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      z-index: 10;
      transition: color 0.3s ease;
    }
    
    .form-group:focus-within .input-icon {
      color: #38bdf8;
    }

    .form-group {
      position: relative;
      margin-bottom: 20px;
    }

    .login-btn {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border: none;
      color: white;
      border-radius: 12px;
      height: 48px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(2, 132, 199, 0.4);
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: white;
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .hospital-line {
      display: flex;
      height: 3px;
      width: 40px;
      margin: 0 auto 20px auto;
      border-radius: 2px;
      overflow: hidden;
    }
    .hospital-line .blue { background: #0284c7; flex: 1; }
    .hospital-line .red { background: #ef4444; flex: 1; }

    #login-error-alert {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
    }
    
    #login-error-alert i {
      margin-right: 10px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="bg-animation"></div>

  <div class="glass-container">
    <div class="glass-card">
      <div class="logo-container">
        <i class="fas fa-heartbeat"></i>
        <div class="hospital-line">
          <div class="blue"></div><div class="red"></div>
        </div>
        <h1 class="login-title">TicSystem</h1>
        <p class="login-subtitle">Hospital Marga Marga</p>
      </div>

      <div id="login-error-alert" class="d-none">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="login-error-message">Credenciales incorrectas.</span>
      </div>

      <form id="login-form" novalidate>
        {% csrf_token %}
        
        <div class="form-group">
          <i class="fas fa-user input-icon"></i>
          <input type="text" id="username" class="form-control custom-input" placeholder="RUT o Usuario (Ej: admin)" required autofocus>
        </div>

        <div class="form-group">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="password" class="form-control custom-input" placeholder="Contraseña" required>
        </div>

        <button type="submit" id="btn-login-submit" class="btn btn-block login-btn mt-4">
          <span id="btn-text">Ingresar al Portal</span>
          <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
        </button>
      </form>
      
      <div class="text-center mt-4">
        <p style="color: #475569; font-size: 0.75rem; margin:0;">Uso exclusivo para funcionarios autorizados.</p>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/static/js/auth.js"></script>
</body>
</html>
