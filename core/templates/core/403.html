{% extends "core/base.html" %}

{% block title %}Acceso Denegado{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="text-center">
        <i class="ms-Icon ms-Icon--ShieldAlert" style="font-size: 80px; color: #d13438;"></i>
        <h1 class="mt-4" style="font-weight: 700; color: #323130;">Acceso Denegado (403)</h1>
        <p class="lead" style="color: #605e5c;">No tienes los permisos necesarios para acceder a esta sección.</p>
        <p style="color: #605e5c;">Si crees que esto es un error, por favor contacta al administrador del sistema.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-primary mt-4" style="background-color: #0078d4; border-color: #0078d4; border-radius: 2px;">
            <i class="fas fa-arrow-left mr-2"></i> Volver al Inicio
        </a>
    </div>
</div>
{% endblock %}
